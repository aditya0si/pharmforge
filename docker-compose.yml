services:
  pharmforge:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./pharmforge/rag/.chroma:/app/pharmforge/rag/.chroma
    environment:
      - OTEL_SDK_DISABLED=true
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional observability (disabled by default; enable with --profile observability)
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=pharmforge
    profiles: ["observability"]
